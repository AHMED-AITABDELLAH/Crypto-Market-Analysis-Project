services:
  kafka:
    image: apache/kafka:4.4.0
    ports:
      # Host tools can connect through localhost:9092.
      - "9092:9092"
    environment:
      # Run Kafka in single-node KRaft mode (Kafka's built-in metadata mode).
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      # Mark Kafka healthy only after the raw candle topic can be ensured.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --create --if-not-exists --topic market.raw.spot.klines --partitions 1 --replication-factor 1"]
      interval: 5s
      timeout: 10s
      retries: 12

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      # Allow local database tools to connect from the host.
      - "5432:5432"
    volumes:
      # Keep database files when containers are recreated.
      - postgres_data:/var/lib/postgresql/data
      # PostgreSQL runs this SQL file once when initializing an empty data volume.
      - ./database/001_initialize_schemas_and_bronze_table.sql:/docker-entrypoint-initdb.d/001_initialize_schemas_and_bronze_table.sql:ro
    healthcheck:
      # Check TCP readiness so this passes after PostgreSQL's init scripts finish.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12

  binance-websocket:
    build:
      context: ./services/binance
      dockerfile: Dockerfile
    environment:
      # Containers reach each other by Compose service name, not localhost.
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    stop_signal: SIGINT
    stop_grace_period: 15s

  kafka-bronze-consumer:
    # Start this optional service with: docker compose --profile database-ingestion up
    profiles: ["database-ingestion"]
    build:
      context: .
      dockerfile: services/kafka/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: market.raw.spot.klines
      # Build the internal connection URL from the same credentials PostgreSQL uses.
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      binance-websocket:
        condition: service_started
    restart: unless-stopped
    stop_signal: SIGINT
    stop_grace_period: 15s

volumes:
  postgres_data:
