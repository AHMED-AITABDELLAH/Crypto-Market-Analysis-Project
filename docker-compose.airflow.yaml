# Test en isolation : docker compose -f docker-compose.airflow.yaml up -d
# Plus tard : fusionner dans le docker-compose.yaml partage.

x-airflow-common: &airflow-common
  image: crypto-airflow:latest        # image construite UNE seule fois et partagee
  build:
    context: .
    dockerfile: infrastructure/airflow/Dockerfile
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_META_DB_USER}:${AIRFLOW_META_DB_PASSWORD}@airflow-postgres:5432/${AIRFLOW_META_DB_NAME}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    PYTHONPATH: /opt/airflow/project
    MARKET_DB_HOST: ${MARKET_DB_HOST}
    MARKET_DB_PORT: ${MARKET_DB_PORT}
    MARKET_DB_USER: ${MARKET_DB_USER}
    MARKET_DB_PASSWORD: ${MARKET_DB_PASSWORD}
    MARKET_DB_NAME: ${MARKET_DB_NAME}
  user: "${AIRFLOW_UID:-50000}:0"
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/config:/opt/airflow/config
    - ./airflow/logs:/opt/airflow/logs
    - ./services:/opt/airflow/project/services
    - ./ml:/opt/airflow/project/ml

services:
  airflow-postgres:
    image: postgres:16
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: ${AIRFLOW_META_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_META_DB_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_META_DB_NAME}
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_META_DB_USER} -d ${AIRFLOW_META_DB_NAME}"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # Postgres LOCAL DE TEST des donnees marche (uniquement avec --profile dev).
  # A supprimer quand le service Postgres du projet sera dans le compose partage.
  market-postgres:
    image: postgres:16
    container_name: market-postgres
    profiles: ["dev"]
    environment:
      POSTGRES_USER: ${MARKET_DB_USER}
      POSTGRES_PASSWORD: ${MARKET_DB_PASSWORD}
      POSTGRES_DB: ${MARKET_DB_NAME}
    volumes:
      - market-postgres-data:/var/lib/postgresql/data
      - ./infrastructure/airflow/dev_init_schemas.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MARKET_DB_USER} -d ${MARKET_DB_NAME}"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER}" \
          --password "${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Admin --lastname Admin \
          --role Admin --email admin@example.com || true
    depends_on:
      airflow-postgres:
        condition: service_healthy
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  airflow-postgres-data:
  market-postgres-data:
